basePath: /
definitions:
  dto.CreateLinkRequest:
    properties:
      original_url:
        example: https://www.example.com/very/long/url
        type: string
      slug:
        example: abc123
        type: string
    required:
    - original_url
    type: object
  dto.ErrorResponse:
    properties:
      data: {}
      msg:
        type: string
      success:
        type: boolean
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
  dto.Response:
    properties:
      data: {}
      msg:
        type: string
      success:
        type: boolean
    type: object
  dto.UserLinkListResponse:
    properties:
      created_at:
        type: string
      original_url:
        type: string
      short_url:
        type: string
      slug:
        type: string
      user_id:
        type: integer
    type: object
host: localhost:8000
info:
  contact: {}
  description: Completed Eventhub backend during Koda Bootcamp
  title: Url Shortener
  version: "1.0"
paths:
  /{slug}:
    get:
      description: Redirect to original URL by slug
      parameters:
      - description: Short link slug
        in: path
        name: slug
        required: true
        type: string
      responses:
        "302":
          description: Found
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Redirect Short Link
      tags:
      - Link
  /api/links:
    get:
      consumes:
      - application/json
      description: Get list of all active short links created by authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.UserLinkListResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerToken: []
      summary: Get All User Short Links
      tags:
      - Link
    post:
      consumes:
      - application/json
      description: Generate short URL with optional custom slug
      parameters:
      - description: Create link body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateLinkRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerToken: []
      summary: Create Short Link
      tags:
      - Link
  /api/links/{id}:
    delete:
      consumes:
      - application/json
      description: Soft delete short link by ID for the authenticated owner
      parameters:
      - description: Link ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerToken: []
      summary: Delete Short Link
      tags:
      - Link
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login Acc from body
      parameters:
      - description: body to login
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Login an Account
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Blacklist the authenticated access token in Redis until its expiration.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully logged out
          schema:
            $ref: '#/definitions/dto.Response'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerToken: []
      summary: Log out an Account
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Regist Acc from body
      parameters:
      - description: body to register
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Register an Account
      tags:
      - Auth
securityDefinitions:
  BearerToken:
    description: Bearer Token used as identity for accessing backend
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
